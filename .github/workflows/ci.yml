name: AgroShift CI/CD Quality Gate

on:
  push:
    branches: [ feature/nasa-data, main, develop ]
  pull_request:
    branches: [ feature/nasa-data, main, develop ]

jobs:
  backend-qa:
    name: Backend Test Suite & Schema Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic jsonschema pytest pytest-asyncio

      - name: Run Pytest Suite Across All Modules
        run: |
          pytest -v tests/

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vite Production Build
        working-directory: frontend
        run: npm run build
