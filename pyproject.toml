[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agroshift-backend"
version = "0.1.0"
description = "AgroShift Backend - NASA Earth Observation and Decision Support Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
    "jsonschema>=4.20.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0"
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
